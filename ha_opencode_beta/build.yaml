---
# NOTE: only OPENCODE_VERSION and OPENCHAMBER_VERSION below are read by CI
# (.github/workflows/build-beta.yaml scrapes them with sed and passes them as
# build args). Both are per-channel pins, which is what lets a new runtime soak
# in beta while stable stays put.
#
# Every other value here is inert — the image is built from
# ha_opencode_beta/Dockerfile and the remaining pins resolve from its ARG
# defaults. Home Assistant does not read this file either, because config.yaml
# sets `image:`. To change one of those for real, edit
# ha_opencode_beta/Dockerfile. See RELEASING.md.
build_from:
  aarch64: ghcr.io/home-assistant/base-debian:trixie
  amd64: ghcr.io/home-assistant/base-debian:trixie
args:
  # The certified OpenCode runtime for this channel. Must be an exact version —
  # never "latest" or a range — and must match the OPENCODE_VERSION ARG default
  # in Dockerfile. test/runtime-contract.test.js asserts both.
  OPENCODE_VERSION: "1.18.21"
  # The other genuine per-channel pin: beta builds from dev, so this can lead
  # stable while a new OpenChamber soaks.
  OPENCHAMBER_VERSION: "1.18.3"
  PPQ_PROXY_VERSION: "0.1.0"
  TSX_VERSION: "4.20.6"
  TTYD_VERSION: "1.7.7"
  YQ_VERSION: "v4.53.3"
labels:
  org.opencontainers.image.title: "OpenCode Beta"
  org.opencontainers.image.description: "Beta channel for OpenCode - AI coding agent for Home Assistant"
  org.opencontainers.image.source: "https://github.com/magnusoverli/opencode"
  org.opencontainers.image.licenses: "Unlicense AND MIT"
  org.opencontainers.image.vendor: "Magnus Overli"
