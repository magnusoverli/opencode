---
# Release CI reads selected channel pins below; the canonical devcontainer build
# helper passes every entry under args. Keep every value aligned with its
# Dockerfile ARG default. Home Assistant itself does not read this file because
# config.yaml sets `image:`. See RELEASING.md.
build_from:
  aarch64: ghcr.io/home-assistant/base-debian:trixie
  amd64: ghcr.io/home-assistant/base-debian:trixie
args:
  NODE_VERSION: "24.15.0"
  # The certified OpenCode runtime for this channel. Must be an exact version —
  # never "latest" or a range — and must match the OPENCODE_VERSION ARG default
  # in Dockerfile. test/runtime-contract.test.js asserts both.
  OPENCODE_VERSION: "1.18.25"
  # OpenCode V2 becomes the beta runtime in 3.0.0b0. V1 remains installed only
  # as an untouched migration/rollback source until V2 activation is complete.
  OPENCODE_V2_VERSION: "0.0.0-beta-18684"
  # The other genuine per-channel pin: beta can lead stable while a new
  # OpenChamber soaks.
  OPENCHAMBER_VERSION: "1.21.0"
  PPQ_PROXY_VERSION: "0.1.0"
  TSX_VERSION: "4.20.6"
  TTYD_VERSION: "1.7.7"
  YQ_VERSION: "v4.53.3"
labels:
  org.opencontainers.image.title: "OpenCode Beta"
  org.opencontainers.image.description: "Beta channel for OpenCode - AI coding agent for Home Assistant"
  org.opencontainers.image.source: "https://github.com/magnusoverli/opencode"
  org.opencontainers.image.licenses: "Unlicense AND MIT"
  org.opencontainers.image.vendor: "Magnus Overli"
