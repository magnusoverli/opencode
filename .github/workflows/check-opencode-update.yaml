---
name: Check OpenCode Update

# Read-only. It never bumps a pin and never opens a PR: the whole point of
# certifying a runtime is that a human decides when a new OpenCode is worth
# testing, and this job only makes that decision an informed one.

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 09:00 UTC
  workflow_dispatch:

jobs:
  check-opencode-update:
    name: Check for OpenCode releases
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Get pinned OpenCode versions
        id: pinned
        run: |
          # build.yaml is the CI-read pin; the Dockerfile ARG default is what a
          # local `docker build` uses. Stable follows the V1 package while beta
          # follows the separately published V2 beta package.
          STABLE_BUILD=$(sed -n 's/^[[:space:]]*OPENCODE_VERSION:[[:space:]]*"\([^"]*\)".*/\1/p' ha_opencode/build.yaml)
          BETA_BUILD=$(sed -n 's/^[[:space:]]*OPENCODE_V2_VERSION:[[:space:]]*"\([^"]*\)".*/\1/p' ha_opencode_beta/build.yaml)
          STABLE_ARG=$(sed -n 's/^ARG OPENCODE_VERSION=\(.*\)$/\1/p' ha_opencode/Dockerfile)
          BETA_ARG=$(sed -n 's/^ARG OPENCODE_V2_VERSION=\(.*\)$/\1/p' ha_opencode_beta/Dockerfile)

          for pair in "stable build.yaml:${STABLE_BUILD}" "beta build.yaml:${BETA_BUILD}" \
                      "stable Dockerfile:${STABLE_ARG}" "beta Dockerfile:${BETA_ARG}"; do
            if [ -z "${pair#*:}" ]; then
              echo "::error::OpenCode runtime pin not found in ${pair%%:*}"
              exit 1
            fi
          done

          {
            echo "stable_build=${STABLE_BUILD}"
            echo "beta_build=${BETA_BUILD}"
            echo "stable_arg=${STABLE_ARG}"
            echo "beta_arg=${BETA_ARG}"
          } >> "$GITHUB_OUTPUT"
          echo "Pinned OpenCode: stable V1=${STABLE_BUILD} beta V2=${BETA_BUILD}"

      - name: Get latest V1 and V2 releases
        id: latest
        run: |
          V1_META=$(curl -fsSL https://registry.npmjs.org/opencode-ai)
          V1_LATEST=$(echo "$V1_META" | jq -r '."dist-tags".latest')
          V1_PUBLISHED=$(echo "$V1_META" | jq -r --arg v "$V1_LATEST" '.time[$v]')
          V2_META=$(curl -fsSL https://registry.npmjs.org/@opencode-ai%2Fcli)
          V2_LATEST=$(echo "$V2_META" | jq -r '."dist-tags".beta')
          V2_PUBLISHED=$(echo "$V2_META" | jq -r --arg v "$V2_LATEST" '.time[$v]')
          if [ -z "${V1_LATEST}" ] || [ "${V1_LATEST}" = "null" ]; then
            echo "::error::Could not read the opencode-ai latest dist-tag from the npm registry"
            exit 1
          fi
          if [ -z "${V2_LATEST}" ] || [ "${V2_LATEST}" = "null" ]; then
            echo "::error::Could not read the @opencode-ai/cli beta dist-tag from the npm registry"
            exit 1
          fi
          {
            echo "v1_version=${V1_LATEST}"
            echo "v1_published=${V1_PUBLISHED}"
            echo "v2_version=${V2_LATEST}"
            echo "v2_published=${V2_PUBLISHED}"
          } >> "$GITHUB_OUTPUT"
          echo "Latest V1: ${V1_LATEST} (${V1_PUBLISHED})"
          echo "Latest V2 beta: ${V2_LATEST} (${V2_PUBLISHED})"

      - name: Summary
        env:
          STABLE_BUILD: ${{ steps.pinned.outputs.stable_build }}
          BETA_BUILD: ${{ steps.pinned.outputs.beta_build }}
          STABLE_ARG: ${{ steps.pinned.outputs.stable_arg }}
          BETA_ARG: ${{ steps.pinned.outputs.beta_arg }}
          V1_LATEST: ${{ steps.latest.outputs.v1_version }}
          V1_PUBLISHED: ${{ steps.latest.outputs.v1_published }}
          V2_LATEST: ${{ steps.latest.outputs.v2_version }}
          V2_PUBLISHED: ${{ steps.latest.outputs.v2_published }}
        run: |
          {
            echo "## OpenCode runtime status"
            echo
            echo "| | Value |"
            echo "|---|---|"
            echo "| Certified stable V1 | \`${STABLE_BUILD}\` |"
            echo "| Latest V1 | [\`${V1_LATEST}\`](https://www.npmjs.com/package/opencode-ai/v/${V1_LATEST}) (${V1_PUBLISHED}) |"
            echo "| Certified beta V2 | \`${BETA_BUILD}\` |"
            echo "| Latest V2 beta | [\`${V2_LATEST}\`](https://www.npmjs.com/package/@opencode-ai/cli/v/${V2_LATEST}) (${V2_PUBLISHED}) |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          drift=""
          if [ "${STABLE_BUILD}" != "${STABLE_ARG}" ]; then
            drift="${drift} stable (build.yaml \`${STABLE_BUILD}\` vs Dockerfile \`${STABLE_ARG}\`)"
          fi
          if [ "${BETA_BUILD}" != "${BETA_ARG}" ]; then
            drift="${drift} beta (build.yaml \`${BETA_BUILD}\` vs Dockerfile \`${BETA_ARG}\`)"
          fi
          if [ -n "${drift}" ]; then
            echo "❌ A channel's two pins disagree:${drift}. Fix before releasing." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${STABLE_BUILD}" != "${V1_LATEST}" ]; then
            {
              echo "⚠️ Stable V1 is behind the latest V1 release. Certify it independently; beta no longer soaks V1."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${BETA_BUILD}" != "${V2_LATEST}" ]; then
            echo "⚠️ A newer V2 beta exists. Re-run the complete V2 compatibility lane before changing the pin." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${STABLE_BUILD}" = "${V1_LATEST}" ] && [ "${BETA_BUILD}" = "${V2_LATEST}" ]; then
            echo "✅ Stable V1 and beta V2 pins match their respective release streams." >> "$GITHUB_STEP_SUMMARY"
          fi
