---
name: Check OpenCode Update

# Read-only. It never bumps a pin and never opens a PR: the whole point of
# certifying a runtime is that a human decides when a new OpenCode is worth
# testing, and this job only makes that decision an informed one.

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 09:00 UTC
  workflow_dispatch:

jobs:
  check-opencode-update:
    name: Check for OpenCode releases
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Get pinned OpenCode versions
        id: pinned
        run: |
          # build.yaml is the CI-read pin; the Dockerfile ARG default is what a
          # local `docker build` uses. They must agree, and a channel left
          # behind is exactly what this report is for, so read all four.
          STABLE_BUILD=$(sed -n 's/^[[:space:]]*OPENCODE_VERSION:[[:space:]]*"\([^"]*\)".*/\1/p' ha_opencode/build.yaml)
          BETA_BUILD=$(sed -n 's/^[[:space:]]*OPENCODE_VERSION:[[:space:]]*"\([^"]*\)".*/\1/p' ha_opencode_beta/build.yaml)
          STABLE_ARG=$(sed -n 's/^ARG OPENCODE_VERSION=\(.*\)$/\1/p' ha_opencode/Dockerfile)
          BETA_ARG=$(sed -n 's/^ARG OPENCODE_VERSION=\(.*\)$/\1/p' ha_opencode_beta/Dockerfile)

          for pair in "stable build.yaml:${STABLE_BUILD}" "beta build.yaml:${BETA_BUILD}" \
                      "stable Dockerfile:${STABLE_ARG}" "beta Dockerfile:${BETA_ARG}"; do
            if [ -z "${pair#*:}" ]; then
              echo "::error::OPENCODE_VERSION not found in ${pair%%:*}"
              exit 1
            fi
          done

          {
            echo "stable_build=${STABLE_BUILD}"
            echo "beta_build=${BETA_BUILD}"
            echo "stable_arg=${STABLE_ARG}"
            echo "beta_arg=${BETA_ARG}"
          } >> "$GITHUB_OUTPUT"
          echo "Pinned OpenCode: stable=${STABLE_BUILD} beta=${BETA_BUILD}"

      - name: Get latest OpenCode release
        id: latest
        run: |
          META=$(curl -fsSL https://registry.npmjs.org/opencode-ai)
          LATEST=$(echo "$META" | jq -r '."dist-tags".latest')
          PUBLISHED=$(echo "$META" | jq -r --arg v "$LATEST" '.time[$v]')
          if [ -z "${LATEST}" ] || [ "${LATEST}" = "null" ]; then
            echo "::error::Could not read the opencode-ai latest dist-tag from the npm registry"
            exit 1
          fi
          {
            echo "version=${LATEST}"
            echo "published=${PUBLISHED}"
          } >> "$GITHUB_OUTPUT"
          echo "Latest opencode-ai release: ${LATEST} (${PUBLISHED})"

      - name: Summary
        env:
          STABLE_BUILD: ${{ steps.pinned.outputs.stable_build }}
          BETA_BUILD: ${{ steps.pinned.outputs.beta_build }}
          STABLE_ARG: ${{ steps.pinned.outputs.stable_arg }}
          BETA_ARG: ${{ steps.pinned.outputs.beta_arg }}
          LATEST: ${{ steps.latest.outputs.version }}
          PUBLISHED: ${{ steps.latest.outputs.published }}
        run: |
          {
            echo "## OpenCode runtime status"
            echo
            echo "| | Value |"
            echo "|---|---|"
            echo "| Certified (stable) | \`${STABLE_BUILD}\` |"
            echo "| Certified (beta) | \`${BETA_BUILD}\` |"
            echo "| Latest on npm | [\`${LATEST}\`](https://www.npmjs.com/package/opencode-ai/v/${LATEST}) |"
            echo "| Published | ${PUBLISHED} |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          drift=""
          if [ "${STABLE_BUILD}" != "${STABLE_ARG}" ]; then
            drift="${drift} stable (build.yaml \`${STABLE_BUILD}\` vs Dockerfile \`${STABLE_ARG}\`)"
          fi
          if [ "${BETA_BUILD}" != "${BETA_ARG}" ]; then
            drift="${drift} beta (build.yaml \`${BETA_BUILD}\` vs Dockerfile \`${BETA_ARG}\`)"
          fi
          if [ -n "${drift}" ]; then
            echo "❌ A channel's two pins disagree:${drift}. Fix before releasing." >> "$GITHUB_STEP_SUMMARY"
          fi

          # V2 is a separate decision governed by OPENCODE_V2_FUTURE.md, so a 2.x
          # release is reported as needing that review rather than as a bump.
          case "${LATEST}" in
            1.*) major_change="" ;;
            *) major_change="yes" ;;
          esac

          behind=""
          if [ "${STABLE_BUILD}" != "${LATEST}" ]; then
            behind="${behind} \`ha_opencode\`"
          fi
          if [ "${BETA_BUILD}" != "${LATEST}" ]; then
            behind="${behind} \`ha_opencode_beta\`"
          fi

          if [ -n "${major_change}" ]; then
            {
              echo "⚠️ The latest release is **${LATEST}**, outside the certified V1 line."
              echo "Do not bump the pin from this report — see \`OPENCODE_V2_FUTURE.md\` for the release gates."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "${behind}" ]; then
            {
              echo "⚠️ A newer OpenCode V1 release is available. To certify it:"
              echo
              echo "1. Bump \`OPENCODE_VERSION\` in both \`build.yaml\` and \`Dockerfile\` for:${behind}"
              echo "2. Work through \`OPENCODE_UPGRADE_CHECKLIST.md\` against a beta build"
              echo "3. Promote only after the beta has soaked"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ Both channels are certified against the latest OpenCode release." >> "$GITHUB_STEP_SUMMARY"
          fi
