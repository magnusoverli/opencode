---
name: Build Beta
run-name: "Build Beta ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}"

on:
  push:
    tags:
      - 'beta-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., 2.0.3b1)'
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ha_opencode_beta

jobs:
  build:
    name: Build Beta ${{ matrix.ha_arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha_arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - ha_arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Test OpenChamber service ownership
        shell: bash
        run: node --test ha_opencode/test/openchamber-s6-services.test.js

      - name: Get version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#beta-v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building beta version: ${VERSION}"

      - name: Get beta build args
        id: beta_build_args
        shell: bash
        run: |
          OPENCHAMBER_VERSION=$(sed -n 's/^[[:space:]]*OPENCHAMBER_VERSION:[[:space:]]*"\([^"]*\)".*/\1/p' ha_opencode_beta/build.yaml)
          if [ -z "${OPENCHAMBER_VERSION}" ]; then
            echo "::error::OPENCHAMBER_VERSION not found in ha_opencode_beta/build.yaml"
            exit 1
          fi
          echo "openchamber_version=${OPENCHAMBER_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Using OpenChamber ${OPENCHAMBER_VERSION} for beta build"

          OPENCODE_VERSION=$(sed -n 's/^[[:space:]]*OPENCODE_VERSION:[[:space:]]*"\([^"]*\)".*/\1/p' ha_opencode_beta/build.yaml)
          if [ -z "${OPENCODE_VERSION}" ]; then
            echo "::error::OPENCODE_VERSION not found in ha_opencode_beta/build.yaml"
            exit 1
          fi
          # A dist-tag or range here would publish a runtime nobody certified,
          # and the image would differ between two builds of the same tag.
          case "${OPENCODE_VERSION}" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error::OPENCODE_VERSION must be an exact version, got '${OPENCODE_VERSION}'"
              exit 1
              ;;
          esac
          echo "opencode_version=${OPENCODE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Using OpenCode ${OPENCODE_VERSION} for beta build"

      - name: Assert this folder really is the beta add-on
        shell: bash
        run: |
          # The two folders ship identical rootfs trees; ADDON_CHANNEL below is
          # the only thing that makes this image behave as beta. If that arg
          # ever stopped matching the folder, beta would write into stable's
          # decision notes and nothing would look wrong until a user noticed.
          grep -qx 'slug: "ha_opencode_beta"' ha_opencode_beta/config.yaml || {
            echo "::error::ha_opencode_beta/config.yaml does not declare slug ha_opencode_beta."
            grep -n "^slug:" ha_opencode_beta/config.yaml
            exit 1
          }
          test -f ha_opencode_beta/Dockerfile || {
            echo "::error::ha_opencode_beta/Dockerfile is missing — the beta add-on is not self-contained."
            exit 1
          }
          echo "OK: building the beta add-on from ha_opencode_beta/ with ADDON_CHANNEL=beta."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.ha_arch }} image
        uses: docker/build-push-action@v7
        with:
          context: ha_opencode_beta
          file: ha_opencode_beta/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/${{ matrix.ha_arch }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/${{ matrix.ha_arch }}:latest
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/base-debian:trixie
            BUILD_VERSION=${{ steps.version.outputs.version }}
            BUILD_ARCH=${{ matrix.ha_arch }}
            ADDON_CHANNEL=beta
            OPENCODE_VERSION=${{ steps.beta_build_args.outputs.opencode_version }}
            OPENCHAMBER_VERSION=${{ steps.beta_build_args.outputs.openchamber_version }}
          cache-from: type=gha,scope=${{ env.IMAGE_NAME }}-${{ matrix.ha_arch }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE_NAME }}-${{ matrix.ha_arch }}
          labels: |
            io.hass.arch=${{ matrix.ha_arch }}
            io.hass.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.title=OpenCode Beta
            org.opencontainers.image.description=Beta channel for OpenCode - AI coding agent for Home Assistant
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Unlicense AND MIT
            io.hass.name=OpenCode Beta

  manifest:
    name: Publish Beta multi-arch manifest
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Get version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#beta-v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        shell: bash
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:latest" \
            "${IMAGE}/amd64:${VERSION}" \
            "${IMAGE}/aarch64:${VERSION}"

      - name: Inspect multi-arch manifest
        shell: bash
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          VERSION: ${{ steps.version.outputs.version }}
        run: docker buildx imagetools inspect "${IMAGE}:${VERSION}"

      - name: Write release image assets
        if: github.event_name == 'push'
        shell: bash
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker buildx imagetools inspect "${IMAGE}:${VERSION}" > image-manifest.txt
          {
            echo "# Container images"
            echo
            echo "Published from ${GITHUB_REPOSITORY}@${GITHUB_SHA}."
            echo
            echo "| Purpose | Image |"
            echo "|---------|-------|"
            echo "| Multi-arch version tag | \`${IMAGE}:${VERSION}\` |"
            echo "| Multi-arch latest tag | \`${IMAGE}:latest\` |"
            echo "| Legacy amd64 alias | \`${IMAGE}/amd64:${VERSION}\` |"
            echo "| Legacy aarch64 alias | \`${IMAGE}/aarch64:${VERSION}\` |"
            echo
            echo "## Manifest"
            echo
            echo '```text'
            cat image-manifest.txt
            echo '```'
          } > container-images.md

      - name: Upload image assets to GitHub Release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          for attempt in {1..30}; do
            if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              gh release upload "${RELEASE_TAG}" \
                --repo "${GITHUB_REPOSITORY}" \
                container-images.md \
                image-manifest.txt \
                --clobber
              exit 0
            fi
            sleep 5
          done

          echo "::error::GitHub Release ${RELEASE_TAG} was not found"
          exit 1
