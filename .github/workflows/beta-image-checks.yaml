---
name: Beta Image Checks

on:
  pull_request:
    paths:
      - ".github/workflows/beta-image-checks.yaml"
      - "ha_opencode_beta/Dockerfile"
      - "ha_opencode_beta/.dockerignore"
      - "ha_opencode_beta/build.yaml"
      - "ha_opencode_beta/rootfs/**"
      - "ha_opencode_beta/test/v2-boundary-fixture.sh"
      - "ha_opencode_beta/test/hab-cli-fixture.mjs"
      - "ha_opencode_beta/test/v2-openchamber-browser.mjs"
      - "ha_opencode_beta/test/v2-provider-startup-fixture.mjs"
      - "ha_opencode_beta/test/v2-zigbee-fixture.mjs"
      - "ha_opencode_beta/test/openchamber-lan-auth.mjs"
      - "ha_opencode_beta/test/openchamber-managed-backend.mjs"
      - "ha_opencode_beta/test/openchamber-request-body.mjs"
      - "ha_opencode_beta/test/openchamber-security.mjs"
      - "ha_opencode_beta/test/openchamber-relay-host.mjs"
      - "ha_opencode_beta/test/v2-lan-fixture.mjs"
      - "ha_opencode_beta/test/opencode-v2-assist*.test.js"
      - "ha_opencode_beta/test/opencode-v2-mcp*.test.js"
      - "ha_opencode_beta/test/fixtures/mcp-saved-options.json"
      - "ha_opencode_beta/test/assist-install.test.py"
      - "ha_opencode_beta/test/helpers/assist-fixture.mjs"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/beta-image-checks.yaml"
      - "ha_opencode_beta/Dockerfile"
      - "ha_opencode_beta/.dockerignore"
      - "ha_opencode_beta/build.yaml"
      - "ha_opencode_beta/rootfs/**"
      - "ha_opencode_beta/test/v2-boundary-fixture.sh"
      - "ha_opencode_beta/test/hab-cli-fixture.mjs"
      - "ha_opencode_beta/test/v2-openchamber-browser.mjs"
      - "ha_opencode_beta/test/v2-provider-startup-fixture.mjs"
      - "ha_opencode_beta/test/v2-zigbee-fixture.mjs"
      - "ha_opencode_beta/test/openchamber-lan-auth.mjs"
      - "ha_opencode_beta/test/openchamber-managed-backend.mjs"
      - "ha_opencode_beta/test/openchamber-request-body.mjs"
      - "ha_opencode_beta/test/openchamber-security.mjs"
      - "ha_opencode_beta/test/openchamber-relay-host.mjs"
      - "ha_opencode_beta/test/v2-lan-fixture.mjs"
      - "ha_opencode_beta/test/opencode-v2-assist*.test.js"
      - "ha_opencode_beta/test/opencode-v2-mcp*.test.js"
      - "ha_opencode_beta/test/fixtures/mcp-saved-options.json"
      - "ha_opencode_beta/test/assist-install.test.py"
      - "ha_opencode_beta/test/helpers/assist-fixture.mjs"
  workflow_dispatch:

concurrency:
  group: beta-image-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha_arch: amd64
            name: Native amd64 boundary
            platform: linux/amd64
            runner: ubuntu-latest
            target: boundary-test
          - ha_arch: aarch64
            name: Native arm64 boundary
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            target: boundary-test
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Build target-native beta image
        uses: docker/build-push-action@v7
        with:
          context: ha_opencode_beta
          file: ha_opencode_beta/Dockerfile
          platforms: ${{ matrix.platform }}
          target: ${{ matrix.target }}
          push: false
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/base-debian:trixie
            BUILD_VERSION=ci
            BUILD_ARCH=${{ matrix.ha_arch }}
            ADDON_CHANNEL=beta
          cache-from: type=gha,scope=ha-opencode-beta-check-${{ matrix.ha_arch }}
          cache-to: type=gha,mode=max,scope=ha-opencode-beta-check-${{ matrix.ha_arch }}
