---
name: Check hab CLI Update

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 09:00 UTC
  workflow_dispatch:

jobs:
  check-hab-update:
    name: Check for hab CLI releases
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Get latest hab CLI release
        id: latest
        run: |
          RELEASE=$(curl -fsSL "https://api.github.com/repos/balloob/home-assistant-build-cli/releases/latest" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}")
          TAG=$(echo "$RELEASE" | jq -r '.tag_name')
          DATE=$(echo "$RELEASE" | jq -r '.published_at')
          URL=$(echo "$RELEASE" | jq -r '.html_url')
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "date=${DATE}" >> $GITHUB_OUTPUT
          echo "url=${URL}" >> $GITHUB_OUTPUT
          echo "Latest hab CLI release: ${TAG} (${DATE})"

      - name: Get pinned hab CLI version
        id: pinned
        run: |
          # Each channel has its own Dockerfile now, so each has its own pin.
          # They are normally equal — promotion copies the Dockerfile across —
          # but reporting only one would hide a channel left behind.
          STABLE=$(grep -oP '^ARG HAB_VERSION=\K\S+' ha_opencode/Dockerfile)
          BETA=$(grep -oP '^ARG HAB_VERSION=\K\S+' ha_opencode_beta/Dockerfile)

          if [ -z "${STABLE}" ] || [ -z "${BETA}" ]; then
            echo "::error::HAB_VERSION not found in one of the Dockerfiles (stable='${STABLE}' beta='${BETA}')."
            exit 1
          fi

          echo "stable=${STABLE}" >> $GITHUB_OUTPUT
          echo "beta=${BETA}" >> $GITHUB_OUTPUT
          echo "Pinned hab CLI version: stable=${STABLE} beta=${BETA}"

      - name: Summary
        env:
          STABLE: ${{ steps.pinned.outputs.stable }}
          BETA: ${{ steps.pinned.outputs.beta }}
          LATEST: ${{ steps.latest.outputs.tag }}
        run: |
          {
            echo "## hab CLI release status"
            echo
            echo "| | Value |"
            echo "|---|---|"
            echo "| Pinned (stable) | \`${STABLE}\` |"
            echo "| Pinned (beta) | \`${BETA}\` |"
            echo "| Latest release | [\`${LATEST}\`](${{ steps.latest.outputs.url }}) |"
            echo "| Released | ${{ steps.latest.outputs.date }} |"
            echo
          } >> $GITHUB_STEP_SUMMARY

          if [ "${STABLE}" != "${BETA}" ]; then
            echo "ℹ️ The channels are pinned to different versions. That is allowed while a bump soaks in beta." >> $GITHUB_STEP_SUMMARY
          fi

          # Plain `if`, not `[ ... ] && var=...`: GitHub runs these steps under
          # `bash -e`, where a false test on the last line fails the step.
          behind=""
          if [ "${STABLE}" != "${LATEST}" ]; then
            behind="${behind} \`ha_opencode/Dockerfile\`"
          fi
          if [ "${BETA}" != "${LATEST}" ]; then
            behind="${behind} \`ha_opencode_beta/Dockerfile\`"
          fi

          if [ -n "${behind}" ]; then
            echo "⚠️ A newer release is available. Bump \`HAB_VERSION\` in:${behind}." >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ Both channels match the latest release." >> $GITHUB_STEP_SUMMARY
          fi
