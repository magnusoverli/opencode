---
name: Channel Sync

# Stable ships from main, beta ships from dev. Anything fixed on main must
# reach dev, or the next beta silently regresses it — that is the discipline
# that killed the original dev branch. This job watches for the drift and
# opens the forward-merge PR so it cannot be forgotten.
#
# The schedule matters: the release workflows push to main using
# GITHUB_TOKEN, and GitHub does not fire `push` triggers for those commits.
# The daily run is what catches version bumps and beta metadata syncs.

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  check:
    name: Check main → dev drift
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Measure drift
        id: drift
        run: |
          if ! git fetch origin dev --quiet 2>/dev/null; then
            echo "::warning::No dev branch — nothing to sync."
            echo "No \`dev\` branch exists yet." >> "$GITHUB_STEP_SUMMARY"
            echo "behind=0" >> "$GITHUB_OUTPUT"
            echo "ahead=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BEHIND=$(git rev-list --count origin/dev..origin/main)
          AHEAD=$(git rev-list --count origin/main..origin/dev)

          echo "behind=${BEHIND}" >> "$GITHUB_OUTPUT"
          echo "ahead=${AHEAD}" >> "$GITHUB_OUTPUT"

          {
            echo "## Channel sync"
            echo
            echo "| | Count |"
            echo "|---|---|"
            echo "| Commits on main missing from dev | ${BEHIND} |"
            echo "| Commits on dev not yet in main | ${AHEAD} |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${BEHIND}" -gt 0 ]; then
            {
              echo "### Missing from dev"
              echo
              echo '```'
              git log --oneline origin/dev..origin/main
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "dev contains everything on main." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open or update the forward-merge PR
        if: steps.drift.outputs.behind != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEHIND: ${{ steps.drift.outputs.behind }}
        run: |
          EXISTING=$(gh pr list --base dev --head main --state open \
            --json number --jq '.[0].number // empty')

          BODY=$(printf '%s\n' \
            "\`main\` (stable) has ${BEHIND} commit(s) that \`dev\` (beta) does not." \
            "" \
            "Merging this keeps the next beta from regressing a stable fix." \
            "" \
            "Opened automatically by \`.github/workflows/channel-sync.yaml\`.")

          if [ -n "${EXISTING}" ]; then
            gh pr edit "${EXISTING}" --body "${BODY}"
            echo "Updated existing PR #${EXISTING}."
            echo "Forward-merge PR: #${EXISTING}" >> "$GITHUB_STEP_SUMMARY"
          else
            URL=$(gh pr create --base dev --head main \
              --title "chore: forward-merge main into dev" \
              --body "${BODY}")
            echo "Opened ${URL}"
            echo "Forward-merge PR: ${URL}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Close a stale forward-merge PR
        if: steps.drift.outputs.behind == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh pr list --base dev --head main --state open \
            --json number --jq '.[0].number // empty')

          if [ -n "${EXISTING}" ]; then
            gh pr close "${EXISTING}" \
              --comment "dev now contains everything on main — closing automatically."
            echo "Closed stale PR #${EXISTING}."
          else
            echo "In sync, no open forward-merge PR."
          fi
